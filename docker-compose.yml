services:
  postgres:
    image: postgres:16
    container_name: orthopedic-clinic-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orthopedic_dev
      POSTGRES_PASSWORD: orthopedic_dev_pass
      POSTGRES_DB: orthopedic_clinic_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orthopedic_dev -d orthopedic_clinic_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
